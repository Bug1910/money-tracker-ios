# 角色：雲端 Mac 編譯機。打 v 開頭的標籤（例如 v1）或手動按 Run workflow 才跑，
# 產出「不簽名」的 IPA，下載後用 iloader／PinFly 側載到 iPhone。
name: Build IPA

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: 1. Fetch source
        uses: actions/checkout@v6

      - name: 2. Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 3. Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 4. Archive (unsigned)
        run: |
          xcodebuild clean archive \
            -project MoneyTracker.xcodeproj \
            -scheme MoneyTracker \
            -configuration Release \
            -archivePath build/MoneyTracker.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 5. Package .app into .ipa
        id: pkg
        run: |
          mkdir -p Payload
          cp -R build/MoneyTracker.xcarchive/Products/Applications/MoneyTracker.app Payload/
          file_name="MoneyTracker-${GITHUB_SHA::7}.ipa"
          zip -qr "$file_name" Payload
          rm -rf Payload
          echo "file_name=$file_name" >> "$GITHUB_OUTPUT"

      - name: 6. Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pkg.outputs.file_name }}
          archive: false
          retention-days: 30
